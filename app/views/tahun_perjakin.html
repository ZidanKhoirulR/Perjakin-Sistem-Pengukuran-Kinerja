<div class="mb-4 flex items-center bg-white p-4 rounded-lg shadow-sm border border-gray-200">
    <h2 class="text-xl font-bold text-gray-800">Tahun Perjakin</h2>
</div>

<div class="mb-5 bg-white rounded-lg shadow-sm border border-gray-200 p-4">
    <form id="filterForm" action="{{ @BASE.'/Tahun-Perjakin' }}" method="GET">
        <div class="flex flex-wrap items-center gap-3">
            <div class="relative w-48">
                <span class="absolute inset-y-0 left-3 flex items-center text-gray-400">
                    <svg class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                            d="M21 21l-4.35-4.35M17 11A6 6 0 1 1 5 11a6 6 0 0 1 12 0z" />
                    </svg>
                </span>
                <input type="text" id="searchInput" placeholder="Cari topik..."
                    class="w-full pl-9 pr-3 py-2 text-sm border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-[#1F4E79] focus:border-[#1F4E79] transition"
                    oninput="filterTable()">
            </div>


            <button type="button" onclick="event.preventDefault(); window.bukaModalTambah();"
                class="ml-auto inline-flex items-center gap-2 px-4 py-2 bg-[#1F4E79] text-white text-sm font-semibold rounded-lg hover:bg-blue-800 transition shadow-sm whitespace-nowrap">
                <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4" />
                </svg>
                Tambah Perjakin Baru
            </button>
        </div>
    </form>
</div>

<div class="bg-white rounded-lg shadow-sm border border-gray-200 overflow-hidden">
    <check if="{{ empty(@topiks) }}">
        <true>
            <div class="p-10 text-center">
                <svg class="mx-auto h-10 w-10 text-gray-300 mb-3" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                        d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z" />
                </svg>
                <p class="text-sm font-medium text-gray-500">Belum ada topik.</p>
                <p class="text-xs text-gray-400 mt-1">Klik "Tambah Perjakin Baru" untuk menambahkan perjakin pertama.
                </p>
            </div>
        </true>
        <false>
            <div class="overflow-x-auto">
                <table class="min-w-full divide-y divide-gray-200">
                    <thead class="bg-gray-50">
                        <tr>
                            <th
                                class="px-4 py-3 text-center text-xs font-semibold text-gray-500 uppercase tracking-wider w-12">
                                No</th>
                            <th
                                class="px-4 py-3 text-center text-xs font-semibold text-gray-500 uppercase tracking-wider">
                                Judul Perjakin</th>
                            <th
                                class="px-4 py-3 text-center text-xs font-semibold text-gray-500 uppercase tracking-wider w-20">
                                Tahun</th>
                            <th
                                class="px-4 py-3 text-center text-xs font-semibold text-gray-500 uppercase tracking-wider">
                                Keterangan</th>
                            <th
                                class="px-4 py-3 text-center text-xs font-semibold text-gray-500 uppercase tracking-wider w-28">
                                Aksi</th>
                        </tr>
                    </thead>
                    <tbody class="bg-white divide-y divide-gray-200" id="tableBody">
                        <repeat group="{{ @topiks }}" value="{{ @t }}" counter="{{ @no }}">
                            <tr class="hover:bg-blue-50 transition-colors" data-id="{{ @t.id }}">
                                <td class="px-4 py-3 text-sm text-gray-900 text-center">
                                    {{ @no }}
                                </td>
                                <td class="px-4 py-3 text-sm font-medium text-gray-900 text-center">{{ @t.judul }}</td>
                                <td class="px-4 py-3 text-sm text-gray-900 text-center">{{ @t.tahun }}</td>
                                <td class="px-4 py-3 text-sm text-gray-900 text-center">{{ @t.keterangan ?: '-' }}</td>
                                <td class="px-4 py-3 text-center">
                                    <div class="flex items-center justify-center space-x-3">
                                        <button onclick="event.preventDefault(); window.bukaModalEdit(this)"
                                            data-topik="{{ htmlspecialchars(json_encode(@t), ENT_QUOTES, 'UTF-8') }}"
                                            class="text-blue-600 hover:text-blue-800 text-sm font-medium transition-colors">
                                            Edit
                                        </button>
                                        <check if="{{ @t.has_tujuan == 0 }}">
                                            <true>
                                                <span class="text-gray-300">|</span>
                                                <button onclick="event.preventDefault(); window.konfirmasiHapus(this)"
                                                    data-id="{{ @t.id }}"
                                                    data-judul="{{ htmlspecialchars(@t.judul, ENT_QUOTES, 'UTF-8') }}"
                                                    class="text-red-500 hover:text-red-700 text-sm font-medium transition-colors">
                                                    Hapus
                                                </button>
                                            </true>
                                        </check>
                                    </div>
                                </td>
                            </tr>
                        </repeat>
                    </tbody>
                </table>
            </div>
        </false>
    </check>
</div>

<input type="hidden" id="sessSuccess" value="{{ @successMsg ?? '' }}">
<input type="hidden" id="sessError" value="{{ @errorMsg ?? '' }}">

<div id="modalTambah" class="hidden fixed inset-0 z-50 flex items-center justify-center bg-black/40">
    <div class="bg-white rounded-2xl shadow-2xl w-full max-w-lg mx-4 overflow-hidden animate-fade-in">
        <div class="bg-[#1F4E79] px-6 py-4 flex justify-between items-center">
            <h3 class="text-base font-semibold text-white flex items-center gap-2">
                <svg class="h-5 w-5 text-blue-200" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4" />
                </svg>
                Tambah Perjakin Baru
            </h3>
            <button onclick="tutupModal('modalTambah')" class="text-blue-200 hover:text-white focus:outline-none">
                <svg class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12" />
                </svg>
            </button>
        </div>
        <form id="formTambah" onsubmit="submitTambah(event)">
            <input type="hidden" name="csrf_token" value="{{ @csrf }}">
            <div class="px-6 py-5 space-y-4">
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Judul Perjakin <span
                            class="text-red-500">*</span></label>
                    <textarea name="judul" rows="3" required
                        class="block w-full border border-gray-300 rounded-lg shadow-sm text-sm focus:ring-[#1F4E79] focus:border-[#1F4E79] px-3 py-2"
                        placeholder="Masukkan judul Perjakin..."></textarea>
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Tahun <span
                            class="text-red-500">*</span></label>
                    <input type="number" name="tahun" required min="2000" max="2099" value="{{ @selectedTahun }}"
                        class="block w-full border border-gray-300 rounded-lg shadow-sm text-sm focus:ring-[#1F4E79] focus:border-[#1F4E79] px-3 py-2">
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Keterangan</label>
                    <textarea name="keterangan" rows="2"
                        class="block w-full border border-gray-300 rounded-lg shadow-sm text-sm focus:ring-[#1F4E79] focus:border-[#1F4E79] px-3 py-2"
                        placeholder="Opsional..."></textarea>
                </div>
            </div>
            <div class="px-6 py-4 border-t border-gray-100 flex justify-end gap-3">
                <button type="button" onclick="tutupModal('modalTambah')"
                    class="px-5 py-2.5 text-sm text-gray-700 bg-white border border-gray-300 rounded-lg hover:bg-gray-50 transition">Batal</button>
                <button type="submit"
                    class="inline-flex items-center gap-2 px-5 py-2.5 text-sm font-semibold text-white bg-[#1F4E79] rounded-lg hover:bg-blue-800 transition">
                    <svg class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7" />
                    </svg>
                    Simpan
                </button>
            </div>
        </form>
    </div>
</div>

<div id="modalEdit" class="hidden fixed inset-0 z-50 flex items-center justify-center bg-black/40">
    <div class="bg-white rounded-2xl shadow-2xl w-full max-w-lg mx-4 overflow-hidden">
        <div class="bg-[#1F4E79] px-6 py-4 flex justify-between items-center">
            <h3 class="text-base font-semibold text-white flex items-center gap-2">
                <svg class="h-5 w-5 text-blue-200" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                        d="M11 5H6a2 2 0 00-2 2v11a2 2 0 002 2h11a2 2 0 002-2v-5m-1.414-9.414a2 2 0 112.828 2.828L11.828 15H9v-2.828l8.586-8.586z" />
                </svg>
                Edit Topik
            </h3>
            <button onclick="tutupModal('modalEdit')" class="text-blue-200 hover:text-white focus:outline-none">
                <svg class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12" />
                </svg>
            </button>
        </div>
        <form id="formEdit" onsubmit="submitEdit(event)">
            <input type="hidden" name="csrf_token" value="{{ @csrf }}">
            <input type="hidden" id="editId" name="id" value="">
            <div class="px-6 py-5 space-y-4">
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Judul Perjakin <span
                            class="text-red-500">*</span></label>
                    <textarea id="editJudul" name="judul" rows="3" required
                        class="block w-full border border-gray-300 rounded-lg shadow-sm text-sm focus:ring-[#1F4E79] focus:border-[#1F4E79] px-3 py-2"></textarea>
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Tahun <span
                            class="text-red-500">*</span></label>
                    <input type="number" id="editTahun" name="tahun" required min="2000" max="2099"
                        class="block w-full border border-gray-300 rounded-lg shadow-sm text-sm focus:ring-[#1F4E79] focus:border-[#1F4E79] px-3 py-2">
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Keterangan</label>
                    <textarea id="editKeterangan" name="keterangan" rows="2"
                        class="block w-full border border-gray-300 rounded-lg shadow-sm text-sm focus:ring-[#1F4E79] focus:border-[#1F4E79] px-3 py-2"></textarea>
                </div>
            </div>
            <div class="px-6 py-4 border-t border-gray-100 flex justify-end gap-3">
                <button type="button" onclick="tutupModal('modalEdit')"
                    class="px-5 py-2.5 text-sm text-gray-700 bg-white border border-gray-300 rounded-lg hover:bg-gray-50 transition">Batal</button>
                <button type="submit"
                    class="inline-flex items-center gap-2 px-5 py-2.5 text-sm font-semibold text-white bg-[#1F4E79] rounded-lg hover:bg-blue-800 transition">
                    <svg class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7" />
                    </svg>
                    Simpan Perubahan
                </button>
            </div>
        </form>
    </div>
</div>


<div id="modalHapus" class="hidden fixed inset-0 z-50 flex items-center justify-center bg-black/40">
    <div class="bg-white rounded-2xl shadow-2xl w-full max-w-md mx-4">
        <div class="px-6 py-6 text-center">
            <div class="mx-auto w-14 h-14 rounded-full bg-red-100 flex items-center justify-center mb-4">
                <svg class="w-7 h-7 text-red-600" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                        d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z" />
                </svg>
            </div>
            <h3 class="text-lg font-semibold text-gray-800 mb-1">Konfirmasi Hapus</h3>
            <p class="text-sm text-gray-500">Anda yakin ingin menghapus topik:</p>
            <p class="text-sm font-semibold text-gray-800 mt-1 px-4" id="hapusKode"></p>
        </div>
        <div class="px-6 pb-5 flex justify-center gap-3">
            <button onclick="tutupModal('modalHapus')"
                class="px-5 py-2 text-sm text-gray-600 bg-gray-100 rounded-lg hover:bg-gray-200 transition">Batal</button>
            <button onclick="submitHapus()"
                class="px-5 py-2 text-sm text-white bg-red-600 rounded-lg hover:bg-red-700 transition font-semibold">Ya,
                Hapus</button>
        </div>
    </div>
</div>


<div id="modalNotif" class="hidden fixed inset-0 z-50 flex items-center justify-center bg-black/40">
    <div class="bg-white rounded-2xl shadow-2xl w-full max-w-sm mx-4 overflow-hidden">
        <div class="px-6 py-6 text-center">
            <div id="notifIcon" class="mx-auto w-14 h-14 rounded-full flex items-center justify-center mb-4"></div>
            <h3 id="notifTitle" class="text-lg font-semibold text-gray-800 mb-1"></h3>
            <p id="notifMessage" class="text-sm text-gray-500"></p>
        </div>
        <div class="px-6 pb-6 flex justify-center">
            <button onclick="tutupNotif()"
                class="px-10 py-2.5 text-sm text-white bg-[#1F4E79] rounded-lg hover:bg-blue-800 transition font-semibold shadow-sm text-center">OK</button>
        </div>
    </div>
</div>


<script>
    // --- JAVASCRIPT KONFIGURASI & FUNGSI GLOBAL ---
    var BASE_URL = '{{ @BASE }}';
    var CSRF_TOKEN = '';
    var TOPIK_ID_HAPUS = null;

    // Fungsi Helper untuk Inisialisasi CSRF
    function initCSRF() {
        var el = document.querySelector('input[name="csrf_token"]');
        if (el) CSRF_TOKEN = el.value;
    }

    // --- FUNGSI MODAL ---
    window.bukaModal = function (id) {
        var modal = document.getElementById(id);
        if (modal) {
            modal.classList.remove('hidden');
            document.body.style.overflow = 'hidden';
        }
    };

    window.tutupModal = function (id) {
        var modal = document.getElementById(id);
        if (modal) {
            modal.classList.add('hidden');
            document.body.style.overflow = '';
        }
    };

    window.tampilNotif = function (status, message) {
        const icon = document.getElementById('notifIcon');
        const title = document.getElementById('notifTitle');
        const msg = document.getElementById('notifMessage');
        if (status === 'success') {
            icon.className = 'mx-auto w-14 h-14 rounded-full bg-green-100 flex items-center justify-center mb-4';
            icon.innerHTML = '<svg class="w-7 h-7 text-green-600" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"/></svg>';
            title.textContent = 'Berhasil!';
        } else {
            icon.className = 'mx-auto w-14 h-14 rounded-full bg-red-100 flex items-center justify-center mb-4';
            icon.innerHTML = '<svg class="w-7 h-7 text-red-600" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/></svg>';
            title.textContent = 'Gagal!';
        }
        msg.textContent = message;
        bukaModal('modalNotif');
    };

    window.tutupNotif = function () {
        window.tutupModal('modalNotif');
        if (window._reloadAfterNotif) {
            window._reloadAfterNotif = false;
            location.reload();
        }
    };

    window.bukaModalTambah = function () {
        var form = document.getElementById('formTambah');
        if (form) form.reset();
        window.bukaModal('modalTambah');
    };

    window.bukaModalEdit = function (btn) {
        try {
            var dataRaw = btn.getAttribute('data-topik');
            var data = JSON.parse(dataRaw);

            var fields = {
                'editId': data.id,
                'editJudul': data.judul,
                'editTahun': data.tahun,
                'editKeterangan': data.keterangan || ''
            };

            for (var id in fields) {
                var el = document.getElementById(id);
                if (el) el.value = fields[id];
            }

            window.bukaModal('modalEdit');
        } catch (e) {
            console.error('Gagal memproses data edit:', e);
        }
    };

    window.konfirmasiHapus = function (btn) {
        TOPIK_ID_HAPUS = btn.getAttribute('data-id');
        var judul = btn.getAttribute('data-judul');

        document.getElementById('hapusKode').textContent = '"' + judul + '"';
        window.bukaModal('modalHapus');
    };

    // --- FUNGSI FILTER ---
    window.filterTable = function () {
        var filterEl = document.getElementById('searchInput');
        var filter = (filterEl ? filterEl.value : '').toLowerCase();
        var tbody = document.getElementById('tableBody');
        if (!tbody) return;

        var rows = tbody.getElementsByTagName('tr');
        for (var i = 0; i < rows.length; i++) {
            var cells = rows[i].getElementsByTagName('td'); if (cells.length > 1) {
                var judul = (cells[1].textContent || '').toLowerCase();
                var ket = (cells[3].textContent || '').toLowerCase();
                rows[i].style.display = (judul.indexOf(filter) > -1 || ket.indexOf(filter) > -1) ? '' : 'none';
            }
        }
    };

    // --- FUNGSI SUBMIT ---
    window.submitTambah = function (e) {
        if (e) e.preventDefault();
        var form = document.getElementById('formTambah');
        if (!form) return;

        initCSRF();
        var formData = new FormData(form);

        fetch(BASE_URL + '/Tahun-Perjakin/store', { method: 'POST', body: formData })
            .then(function (r) { return r.json(); })
            .then(function (json) {
                window.tutupModal('modalTambah');
                window._reloadAfterNotif = json.status === 'success';
                window.tampilNotif(json.status, json.message);
            })
            .catch(function (err) {
                console.error(err);
                window.tutupModal('modalTambah');
                window.tampilNotif('error', 'Terjadi kesalahan jaringan.');
            });
    };

    window.submitEdit = function (e) {
        if (e) e.preventDefault();
        var form = document.getElementById('formEdit');
        var idEl = document.getElementById('editId');
        var id = idEl ? idEl.value : null;
        if (!form || !id) return;

        initCSRF();
        var formData = new FormData(form);

        fetch(BASE_URL + '/Tahun-Perjakin/update/' + id, { method: 'POST', body: formData })
            .then(function (r) { return r.json(); })
            .then(function (json) {
                window.tutupModal('modalEdit');
                window._reloadAfterNotif = json.status === 'success';
                window.tampilNotif(json.status, json.message);
            })
            .catch(function (err) {
                console.error(err);
                window.tutupModal('modalEdit');
                window.tampilNotif('error', 'Terjadi kesalahan jaringan.');
            });
    };

    window.submitHapus = function () {
        if (!TOPIK_ID_HAPUS) return;

        initCSRF();
        var formData = new FormData();
        formData.append('csrf_token', CSRF_TOKEN);

        fetch(BASE_URL + '/Tahun-Perjakin/delete/' + TOPIK_ID_HAPUS, { method: 'POST', body: formData })
            .then(function (r) { return r.json(); })
            .then(function (json) {
                window.tutupModal('modalHapus');
                window._reloadAfterNotif = json.status === 'success';
                window.tampilNotif(json.status, json.message);
            })
            .catch(function (err) {
                console.error(err);
                window.tutupModal('modalHapus');
                window.tampilNotif('error', 'Terjadi kesalahan jaringan.');
            });
    };

    // Inisialisasi Awal
    initCSRF();

    // Auto-detect session messages
    window.onload = function () {
        const s = document.getElementById('sessSuccess').value;
        const e = document.getElementById('sessError').value;
        if (s) tampilNotif('success', s);
        else if (e) tampilNotif('error', e);
    };

    // Event Listener untuk Backdrop
    document.addEventListener('click', function (e) {
        ['modalTambah', 'modalEdit', 'modalHapus', 'modalNotif'].forEach(function (id) {
            var el = document.getElementById(id);
            if (el && e.target === el) window.tutupModal(id);
        });
    });

</script>
