<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Selamat Datang di Perjakin</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap"
        rel="stylesheet">

    <link rel="preload" href="{{ @BASE }}/public/img/background1.jpeg" as="image">

    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="{{ @BASE }}/public/css/style.css">
    <link rel="stylesheet" href="{{ @BASE }}/public/css/login.css">
</head>

<body class="custom-gradient min-h-screen flex flex-col justify-center py-12 sm:px-6 lg:px-8">

    <div class="slider-container">
        <div class="bg-slideshow"></div>
        <div class="bg-slideshow"></div>
        <div class="bg-slideshow"></div>
    </div>
    <div class="bg-overlay"></div>

    <div class="sm:mx-auto sm:w-full sm:max-w-sm text-center">
        <h2 class="text-3xl font-extrabold text-white">PERJAKIN</h2>
        <p class="mt-2 text-sm text-blue-100">Sistem Pengukuran Kinerja Instansi</p>
    </div>

    <div class="mt-6 sm:mx-auto sm:w-full sm:max-w-sm">
        <div class="bg-white py-6 px-4 shadow-lg sm:rounded-xl sm:px-8">

            <F3:check if="{{ isset(@error) && @error }}">
                <div id="server-error" class="bg-red-50 border-l-4 border-red-500 p-4 mb-6">
                    <div class="flex">
                        <div class="flex-shrink-0">
                            <svg class="h-5 w-5 text-red-500" viewBox="0 0 20 20" fill="currentColor">
                                <path fill-rule="evenodd"
                                    d="M10 18a8 8 0 100-16 8 8 0 000 16zM8.707 7.293a1 1 0 00-1.414 1.414L8.586 10l-1.293 1.293a1 1 0 101.414 1.414L10 11.414l1.293 1.293a1 1 0 001.414-1.414L11.414 10l1.293-1.293a1 1 0 00-1.414-1.414L10 8.586 8.707 7.293z"
                                    clip-rule="evenodd" />
                            </svg>
                        </div>
                        <div class="ml-3">
                            <p class="text-sm text-red-700">{{ @error }}</p>
                        </div>
                    </div>
                </div>
            </F3:check>

            <div id="ajax-alert" class="hidden p-4 mb-4 rounded-lg text-sm font-medium"></div>

            <form id="loginForm" class="space-y-5" action="{{ @BASE.'/loginsila' }}" method="POST">
                <input type="hidden" name="csrf_token" id="csrf_token" value="{{ @csrf }}">

                <div class="login-input-wrap">
                    <input id="username" name="userID" type="text" autocomplete="username" required
                        class="login-input" placeholder="Username">
                    <span class="input-icon-right">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor">
                            <path
                                d="M12 12c2.7 0 4.8-2.1 4.8-4.8S14.7 2.4 12 2.4 7.2 4.5 7.2 7.2 9.3 12 12 12zm0 2.4c-3.2 0-9.6 1.6-9.6 4.8v2.4h19.2v-2.4c0-3.2-6.4-4.8-9.6-4.8z" />
                        </svg>
                    </span>
                </div>

                <div class="login-input-wrap">
                    <input id="password" name="password" type="password" autocomplete="current-password" required
                        class="login-input" placeholder="Password">
                    <span class="input-icon-right">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor">
                            <path
                                d="M18 8h-1V6c0-2.8-2.2-5-5-5S7 3.2 7 6v2H6c-1.1 0-2 .9-2 2v10c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2V10c0-1.1-.9-2-2-2zm-6 9c-1.1 0-2-.9-2-2s.9-2 2-2 2 .9 2 2-.9 2-2 2zm3.1-9H8.9V6c0-1.7 1.4-3.1 3.1-3.1 1.7 0 3.1 1.4 3.1 3.1v2z" />
                        </svg>
                    </span>
                </div>

                <div id="otp-section" class="-mt-2">
                    <div>
                        <span class="otp-label">OTP</span>
                        <div class="login-input-wrap">
                            <input type="text" id="d1" name="otp_onsign"
                                class="login-input" placeholder="otp_onsign">
                            <span class="input-icon-right">
                                <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor">
                                    <path
                                        d="M18 8h-1V6c0-2.8-2.2-5-5-5S7 3.2 7 6v2H6c-1.1 0-2 .9-2 2v10c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2V10c0-1.1-.9-2-2-2zm-6 9c-1.1 0-2-.9-2-2s.9-2 2-2 2 .9 2 2-.9 2-2 2zm3.1-9H8.9V6c0-1.7 1.4-3.1 3.1-3.1 1.7 0 3.1 1.4 3.1 3.1v2z" />
                                </svg>
                            </span>
                        </div>


                    </div>
                </div>

                <div>
                    <button type="submit" id="mainBtn"
                        class="w-full flex justify-center items-center gap-2 py-2 px-4 border border-transparent rounded-md shadow-sm text-sm font-medium text-white bg-[#1F4E79] hover:bg-[#16395b] focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-[#1F4E79] transition duration-150 ease-in-out">
                        <span id="btnSpinner" class="hidden">
                            <svg class="animate-spin h-4 w-4 text-white" fill="none" viewBox="0 0 24 24">
                                <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor"
                                    stroke-width="4"></circle>
                                <path class="opacity-75" fill="currentColor"
                                    d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4z"></path>
                            </svg>
                        </span>
                        <span id="btnText">Login</span>
                    </button>
                </div>
            </form>

            <p class="mt-4 text-center text-sm text-black">
                Lupa Password? Silahkan Hubungi Administrator
            </p>
        </div>
    </div>

    <script src="{{ @BASE }}/public/js/script.js"></script>
    <script>
        (function () {
            // Karena alurSILAmenggunakan submit form normal (bukan AJAX bertahap),
            // OTP section harus ditampilkan jika ada session F3 yg menandakan OTP sedang ditunggu.
            // Di AuthController::loginsila, jika sukses tahap 1 (OTP dikirim), F3 akan reroute ke /login
            // dan kita perlu mendeteksinya. Berarti kita cek apabila `IDid` sudah ada di SESSION.
            
            var isOtpSent = false;
            <F3:check if="{{ isset(@SESSION.IDid_temp) && @SESSION.IDid_temp }}">
                isOtpSent = true;
            </F3:check>

            if (isOtpSent) {
                showOTPSection();
                // Jangan reset password, biarkan user ketik (atau browser autofill)
                // karena flow SILA butuh password lg saat submit OTP
                document.getElementById('d1').focus();
            }

            // Jika ada pesan error (seperti salah OTP / Password)
            if (document.getElementById('server-error')) {
                var errText = document.getElementById('server-error').innerText || '';
                if (errText.toLowerCase().includes('otp')) {
                    showOTPSection();
                }
            }





            function showOTPSection() {
                document.getElementById('otp-section').classList.add('visible');
            }

            function hideOTPSection() {
                document.getElementById('otp-section').classList.remove('visible');
            }

            function showAlert(type, msg) {
                var el = document.getElementById('ajax-alert');
                el.textContent = msg;
                var base = 'p-4 mb-4 rounded-lg text-sm font-medium ';
                if (type === 'success') {
                    el.className = base + 'bg-green-50 text-green-800 border border-green-200';
                } else if (type === 'warning') {
                    el.className = base + 'bg-yellow-50 text-yellow-800 border border-yellow-200';
                } else {
                    el.className = base + 'bg-red-50 text-red-700 border border-red-200';
                }
                el.classList.remove('hidden');
            }
        })();
    </script>


</body>

</html>
